# -+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+
#        [KUMANDRA'S ECONOMY SUPPORT] [1.6.0]
# -+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+
# Custom Enchantments 3 works perfectly well on its
# own, and every setting below does nothing at all
# unless Kumandra's Economy 2.1 or newer is also
# installed on the server. Nothing here is required.
#
# What it does when both plugins are present:
#  - Players can pay for RACO priced things using
#    Kumandra currency (Kd), converted at the rate
#    below.
#  - Players can convert RACO to Kd and back in the
#    currency exchange screen.
#
# Important: Kd is never turned into RACO out of
# nothing. Paying with Kd buys RACO from the same
# circulating supply the CLVL exchange draws on, so
# the RACO supply cap still means what it says and
# the two currencies cannot be played against each
# other. If the supply cannot cover a purchase the
# Kd payment fails and refunds instead.
#
# Master switch. Set to false and CE3 behaves exactly
# as it did in 1.5.0 whether or not Kumandra is here.
KumandraEconomySupport: true
# How much Kumandra currency one single RACO is worth.
# 25 means 1 RACO costs 25 Kd. Raising this makes RACO
# more expensive to buy with Kd and worth more to sell.
KumandraExchangeRate: 25.0
# Fee on converting between the two currencies, as a
# decimal. 0.05 is 5%. It is taken off the proceeds
# when converting RACO to Kd, and added on top as a
# surcharge when paying a RACO price with Kd, so
# holding RACO is always slightly better than paying
# in the foreign currency.
# Set to 0 for a straight rate with no fee.
KumandraConversionFee: 0.05
# Allow Kd to settle a purchase in the RACO shop when
# the player does not hold enough RACO. A player who
# does hold enough RACO always spends the RACO.
KumandraShopPayment: true
# Allow Kd to buy an enchantment book whose price in
# this file ends with 'C' (a RACO price).
KumandraEnchantPayment: true
# Allow the two way RACO <-> Kd conversion buttons in
# the currency exchange screen.
KumandraConversionEnabled: true
# -+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+
#                [Custom Looting]
# -+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+
# CE Looting only occur when a player opens an
# non looted chest from any locations in the server.
# Custom Enchantments LootItems can be found in
# LootItem.yml and you can modify the file if you want.
#
# Allow CE Looting in Server?
CustomLootingAllowed: true
# Item Rarity Chances in decimal. (0.5 = 50%)
CommonChance: 0.3
UncommonChance: 0.1
RareChance: 0.05
VeryRareChance: 0.01
EpicChance: 0.005
LegendaryChance: 0.0002
# The loot chest can only contain 'UP TO'
# 2 common, 2 uncommon, 1 rare, 1 very rare, 1 epic
# and 1 legendary item.
# ----------------TREASURE ITEM------------------
# Treasure Items are rare items that has passive
# abilities, the effect will work if the item is
# in the player's inventory
TreasureItemChance: 0.05
# Set the chance of rewarding raco coins to players
# who have TreasureItem with RACO reward (default: 0.5)
RACOrewardChance: 0.5
# ---------------- TREASURE STAT TUNING [1.5.0] --------------
# Before 1.5.0 the 'physical_dmg' and 'physical_def' stats on
# treasure items were shown in their lore but never actually
# reached the damage code. They work now.
#
# physical_dmg is SUMMED across everything you carry, so it is
# capped here. Set the cap to 0 to keep the old behaviour where
# the stat did nothing.
# ---------------- TREASURE DROP WEIGHTS [1.5.0] -------------
# Which treasure you get is a weighted draw now. Before 1.5.0
# every treasure was equally likely, which was fine at 34 items
# and is not at 134: it would make the best item in the game
# exactly as likely as a Dried Fish.
#
# Higher weight means more common. These are relative to each
# other, not percentages. Set a tier to 0 to take that whole
# tier out of chest loot.
TreasureWeightCommon: 100
TreasureWeightUncommon: 45
TreasureWeightRare: 18
TreasureWeightEpic: 5
TreasureWeightLegendary: 1
TreasurePhysicalDamageCap: 6.0
# Highest total flat MAGIC damage carried treasure items can
# add. magical_dmg is also summed, and unlike the physical one
# it has been live since long before 1.5.0 with no ceiling at
# all, so a stack of one item was unbounded damage.
#
# Careful, the two caps read 0 differently on purpose:
#   TreasurePhysicalDamageCap: 0  -> the stat does nothing
#                                    (what it did before 1.5.0)
#   TreasureMagicalDamageCap: 0   -> no ceiling
#                                    (what it did before 1.5.0)
# In both cases 0 restores the pre-1.5.0 behaviour, which is
# why they differ.
TreasureMagicalDamageCap: 6.0
# physical_def is averaged across what you carry, then scaled by
# this before it is applied as damage reduction. The raw values
# go up to 0.7, which would be 70% on top of Tank's 60%, so they
# are scaled down. Set the scale to 0 to keep the old behaviour.
TreasurePhysicalDefenseScale: 0.25
# and hard capped here, no matter what is carried.
TreasurePhysicalDefenseCap: 0.20
# ------------------------------------------------
# Do you allow custom loot structure generation?
# You can create your own custom loot plot by
# doing '/ce settings lootingPlot generate'
AllowLootPlots: true
LootPlotSpawnChance: 0.2
# -+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+
#                 [EXPERIMENTAL]
# -+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+
# Amount of particle can be changed from 0 to 100,
# mostly magic enchantments are affected.
# Default value is 80% for a high detailed effect,
# changing the value to 0% will almost remove the
# particle effect of the affected enchantments.
# 100% is very high detail particle effect and may
# cause performance issue not on the server but on
# the client side (PLAYERS PLAYING).
ParticleAmount: 80
# Wand magic damage, this associate with the base
# damage of fireball 1, it will be multiplied by
# how much level of fireball does the magic wand
# has. Default value is 0.5
# Most magic enchantments are also affected but
# setting MagicWandDamage to 0 doesn't remove the
# magic damage of magic enchantments.
# Note: Magic damage is 3 times greater than the
# vanilla physical damage.
MagicWandDamage: 1.5
# Loot Plot Generation
# This may be CPU intensive, but it allows generating
# Loot plots around the world
GenerateLootPlots: true
# ------------------------------------------------
#                 PlaceholderAPI
# ------------------------------------------------
# Publishes the %ce3_...% placeholders when
# PlaceholderAPI is installed. Player values such
# as %ce3_mana% and %ce3_level%, and the plugin's
# own timings under %ce3_perf_...%.
# The timings are the reason this exists: if the
# server is running badly, %ce3_perf_melee_tick%
# tells you what share of a tick CE3 combat is
# actually costing, rather than leaving you to
# guess from a profiler that blames one listener
# for thirty enchantments.
# '/ce perf' prints the same numbers with or
# without PlaceholderAPI installed.
# Turning this off unregisters nothing that is
# already registered until the next restart.
PlaceholderAPISupport: true
