  TS_Shop_1: "Now, let's set up a simple shop"
  TS_Shop_2: "A simple villager sword enchantment shop"
  TS_Shop_3: "do the command:"
  TS_Shop_4: "'/ce Shop Add VILLAGER SWORD Sword Shop'"
  TS_Shop_5: "Please follow the command shown above"
  TS_Shop_6: "It should be of Shop Entity Type: VILLAGER"
  TS_Shop_7: "It should be of Shop Type: SWORD"
  TS_Shop_8: "It should be of Shop Name: Sword Shop"
  TS_Shop_9: "Cool! You've made your first shop!"
  TS_Shop_10: "Now try interacting it"
  TS_Shop_11: "Right Click the shop"
  TS_Shop_12: "Cool! We're almost done!"
  TS_Shop_13: "Now that you've created a shop, lets"
  TS_Shop_14: "try the remove command"
  TS_Shop_15: "/ce Shop Remove Sword Shop"
  TS_Shop_16: "Good Job!"
  TS_Shop_17: "I'm so proud of you!"
  TS_Shop_18: "Now try creating shops in your server"
  TS_LevelUp_1: "Okay... Let's start at the very basic, try killing any mob to gain Exp"
  TS_LevelUp_2: "Cool! You've just gained an EXP buy killing a mob, now try breaking any type of block"
  TS_LevelUp_3: "Now you're learning! I'm proud of you!"
  TS_LevelUp_4: "Each time you kill a mob or break a block, you will gain EXP. If you reach a certain EXP threshold, you will get 1 level. Let's go back to the Skills UI"
  TS_LevelUp_5: "'/ce skills'"
  TS_LevelUp_6: "As you can see, you are currently level _a and have _b attribute point to spend"
  TS_LevelUp_7: "ATTRIBUTE POINTS can be invested to enhance core stats: Strength, Agility, and Intelligence. Each point spent increases your chosen attribute, shaping your character's overall abilities and play style."
  TS_LevelUp_8: "By continuously grinding and reaching level 10, you'll earn 1 Skill Point. Skill Points are only awarded at milestone levels that are multiples of 10 such as level 10, 20, 30, and so on."
  TS_LevelUp_9: "SKILL POINTS can be spent to unlock specific abilities within a chosen class, such as Archery, Wizard, or Warrior. Once you select a class, you are limited to upgrading only its mastery skills, allowing you to specialize and progress within that path."
  TS_LevelUp_10: "I hope you've picked up some tips on leveling up today. Now get out there, enjoy the grind, and keep pushing forward, wishing you the best on your journey!"
  TS_QuestShop_1: "Now that you've got a good spot, let's create a simple quest for now, do the command below and follow the steps. \nNote: don't put space(' ') after each comma's"
  TS_QuestShop_1_1: "YT Tutorial: https://youtu.be/8Ojqnw-8Mnc"
  TS_QuestShop_2: "'/ce quest add'"
  TS_QuestShop_3: "Now that you have created a simple quest, to show the list of quest, you'll just need to do '/ce quest list' and make sure to take note if the 5-digit ID since we will need it."
  TS_QuestShop_4: "'/ce quest list'"
  TS_QuestShop_5: "Let's create a quest shop now"
  TS_QuestShop_6: "'/ce shop add VILLAGER QUEST My Quest'"
  TS_QuestShop_7: "It should be of Shop Type: QUEST"
  TS_QuestShop_8: "It should be of Shop Name: My Quest"
  TS_QuestShop_9: "Right Click the quest shop and start a quest!"
  TS_QuestShop_10: "'/ce Shop Remove My Quest'"
  TS_QuestShop_11: "Now try creating quests in your server"
  TS_Quest_1: "'/ce quest'"
  TS_Quest_2: "Find the quest shop to begin your adventure! Simply right-click on the shop to receive a quest, then choose whether to accept or decline it. If you decide to decline, you'll need to wait one minute before another quest becomes available."
  TS_Quest_3: "Congratulations on completing your quest! You can start a new one anytime to earn even more rewards."
