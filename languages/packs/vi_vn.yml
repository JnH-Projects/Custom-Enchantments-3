  TS_LevelUp_1: "Được rồi... Bắt đầu từ cơ bản nhé, hãy giết một con quái bất kỳ để nhận kinh nghiệm"
  TS_LevelUp_2: "Tuyệt! Bạn vừa nhận kinh nghiệm từ quái, giờ thử phá một khối bất kỳ"
  TS_LevelUp_3: "Bạn học nhanh đấy! Tôi tự hào về bạn!"
  TS_LevelUp_4: "Mỗi lần giết quái hoặc phá khối, bạn nhận kinh nghiệm. Khi đạt đủ mức, bạn lên 1 cấp. Hãy quay lại giao diện kỹ năng"
  TS_LevelUp_5: "'/ce skills'"
  TS_LevelUp_6: "Như bạn thấy, bạn đang ở cấp _a và có _b điểm thuộc tính để dùng"
  TS_LevelUp_7: "ĐIỂM THUỘC TÍNH dùng để tăng chỉ số cơ bản: Sức mạnh, Nhanh nhẹn và Trí tuệ. Mỗi điểm tăng thuộc tính bạn chọn, định hình năng lực và lối chơi của nhân vật."
  TS_LevelUp_8: "Cứ cày đến cấp 10, bạn sẽ nhận 1 điểm kỹ năng. Điểm kỹ năng chỉ được trao ở các mốc chia hết cho 10 như cấp 10, 20, 30, v.v."
  TS_LevelUp_9: "ĐIỂM KỸ NĂNG dùng để mở khóa năng lực riêng của lớp đã chọn, như Cung thủ, Pháp sư hoặc Chiến binh. Khi đã chọn lớp, bạn chỉ có thể nâng cấp các kỹ năng tinh thông của lớp đó để chuyên sâu theo con đường ấy."
  TS_LevelUp_10: "Mong là hôm nay bạn đã học được vài mẹo lên cấp. Giờ hãy ra ngoài, tận hưởng việc cày cấp và tiếp tục tiến lên, chúc bạn may mắn trên hành trình!"
  TS_QuestShop_1: "Bạn đã có chỗ tốt rồi, giờ hãy tạo một nhiệm vụ đơn giản. Dùng lệnh bên dưới và làm theo các bước.\nLưu ý: đừng thêm dấu cách(' ') sau dấu phẩy"
  TS_QuestShop_1_1: "Hướng dẫn YT: https://youtu.be/8Ojqnw-8Mnc"
  TS_QuestShop_2: "'/ce quest add'"
  TS_QuestShop_3: "Bạn đã tạo một nhiệm vụ đơn giản. Để xem danh sách nhiệm vụ, dùng '/ce quest list' và ghi nhớ ID 5 chữ số vì chúng ta sẽ cần nó."
  TS_QuestShop_4: "'/ce quest list'"
  TS_QuestShop_5: "Giờ hãy tạo một cửa hàng nhiệm vụ"
  TS_QuestShop_6: "'/ce shop add VILLAGER QUEST My Quest'"
  TS_QuestShop_7: "Loại cửa hàng phải là: QUEST"
  TS_QuestShop_8: "Tên cửa hàng phải là: My Quest"
  TS_QuestShop_9: "Nhấp chuột phải vào cửa hàng nhiệm vụ để bắt đầu!"
  TS_QuestShop_10: "'/ce Shop Remove My Quest'"
  TS_QuestShop_11: "Giờ hãy tạo nhiệm vụ trên máy chủ của bạn"
  TS_Quest_1: "'/ce quest'"
  TS_Quest_2: "Tìm cửa hàng nhiệm vụ để bắt đầu cuộc phiêu lưu! Nhấp chuột phải vào cửa hàng để nhận nhiệm vụ, rồi chọn nhận hoặc từ chối. Nếu từ chối, bạn phải chờ một phút mới có nhiệm vụ khác."
  TS_Quest_3: "Chúc mừng bạn đã hoàn thành nhiệm vụ! Bạn có thể bắt đầu nhiệm vụ mới bất cứ lúc nào để nhận thêm phần thưởng."
