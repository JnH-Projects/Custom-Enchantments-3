  TS_LevelUp_1: "Oke... Kita mulai dari dasar, coba bunuh mob apa saja untuk dapat EXP"
  TS_LevelUp_2: "Keren! Kamu dapat EXP dari mob, sekarang coba hancurkan blok apa saja"
