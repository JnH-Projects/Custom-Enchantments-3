  TS_LevelUp_4: "Setiap membunuh mob atau menghancurkan blok, kamu dapat EXP. Kalau EXP-mu cukup, kamu naik 1 level. Ayo kembali ke menu keahlian"
  TS_LevelUp_5: "'/ce skills'"
  TS_LevelUp_6: "Seperti yang kamu lihat, sekarang kamu level _a dan punya _b poin atribut"
  TS_LevelUp_7: "POIN ATRIBUT dipakai untuk meningkatkan stat dasar: Kekuatan, Kelincahan, dan Kecerdasan. Setiap poin menambah atribut pilihanmu dan membentuk kemampuan serta gaya bermain karaktermu."
  TS_LevelUp_8: "Dengan terus grinding sampai level 10, kamu dapat 1 Poin Keahlian. Poin Keahlian hanya diberikan di level kelipatan 10 seperti level 10, 20, 30, dan seterusnya."
  TS_LevelUp_9: "POIN KEAHLIAN dipakai untuk membuka kemampuan khusus kelas pilihanmu, seperti Pemanah, Penyihir, atau Prajurit. Setelah memilih kelas, kamu hanya bisa meningkatkan keahlian penguasaan kelas itu."
  TS_LevelUp_10: "Semoga kamu dapat beberapa tips naik level hari ini. Sekarang pergilah, nikmati grinding-nya, dan terus maju, semoga sukses di perjalananmu!"
  TS_QuestShop_1: "Kamu sudah dapat tempat yang bagus, ayo buat quest sederhana. Pakai perintah di bawah dan ikuti langkahnya.\nCatatan: jangan pakai spasi(' ') setelah koma"
