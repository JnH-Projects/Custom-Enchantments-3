  TS_LevelUp_1: "Oké... Laten we bij het begin beginnen, probeer een willekeurige mob te doden om Exp te verdienen"
  TS_LevelUp_2: "Gaaf! Je hebt zojuist EXP verdiend door een mob te doden, probeer nu een willekeurig blok te breken"
  TS_LevelUp_3: "Nu leer je het! Ik ben trots op je!"
  TS_LevelUp_4: "Elke keer dat je een mob doodt of een blok breekt, verdien je EXP. Als je een bepaalde EXP-drempel bereikt, krijg je 1 level. Laten we teruggaan naar de Vaardigheden-UI"
  TS_LevelUp_5: "'/ce skills'"
  TS_LevelUp_6: "Zoals je kunt zien, ben je momenteel level _a en heb je _b attribuutpunt om te besteden"
  TS_LevelUp_7: "ATTRIBUUTPUNTEN kunnen worden geïnvesteerd om kernstatistieken te verbeteren: Kracht, Behendigheid en Intelligentie. Elk besteed punt verhoogt je gekozen attribuut en vormt de algemene vaardigheden en speelstijl van je personage."
  TS_LevelUp_8: "Door continu te trainen en level 10 te bereiken, verdien je 1 vaardigheidspunt. Vaardigheidspunten worden alleen toegekend op mijlpaallevels die een veelvoud van 10 zijn, zoals level 10, 20, 30, enzovoort."
  TS_LevelUp_9: "VAARDIGHEIDSPUNTEN kunnen worden besteed om specifieke vaardigheden binnen een gekozen klasse te ontgrendelen, zoals Boogschutter, Tovenaar of Krijger. Zodra je een klasse kiest, ben je beperkt tot het upgraden van alleen die meesterschapsvaardigheden, zodat je je kunt specialiseren en vooruitgang kunt boeken binnen dat pad."
  TS_LevelUp_10: "Ik hoop dat je vandaag wat tips hebt opgestoken over levelen. Ga er nu op uit, geniet van het trainen en blijf vooruitgaan. Ik wens je het allerbeste op je reis!"
  TS_QuestShop_1: "Nu je een goede plek hebt gevonden, maken we eerst een eenvoudige missie. Voer het onderstaande commando uit en volg de stappen. \nOpmerking: zet geen spatie(' ') na elke komma"
  TS_QuestShop_1_1: "YT-handleiding: https://youtu.be/8Ojqnw-8Mnc"
  TS_QuestShop_2: "'/ce quest add'"
  TS_QuestShop_3: "Nu je een eenvoudige missie hebt gemaakt, typ je '/ce quest list' om de missielijst te bekijken en noteer je de 5-cijferige ID, want die hebben we straks nodig."
  TS_QuestShop_4: "'/ce quest list'"
  TS_QuestShop_5: "Laten we nu een missiewinkel maken"
  TS_QuestShop_6: "'/ce shop add VILLAGER QUEST My Quest'"
  TS_QuestShop_7: "Het moet het winkeltype hebben: QUEST"
  TS_QuestShop_8: "Het moet de winkelnaam hebben: My Quest"
  TS_QuestShop_9: "Klik met rechts op de missiewinkel en start een missie!"
