  TS_Quest_2: "Zoek de missiewinkel om je avontuur te beginnen! Klik simpelweg met rechts op de winkel om een missie te ontvangen en kies of je deze wilt accepteren of weigeren. Als je besluit te weigeren, moet je één minuut wachten voordat er een nieuwe missie beschikbaar komt."
  TS_Quest_3: "Gefeliciteerd met het voltooien van je missie! Je kunt op elk moment een nieuwe starten om nog meer beloningen te verdienen."
